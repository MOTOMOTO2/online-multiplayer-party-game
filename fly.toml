# Fly.io deployment for Bluffalo.
#
# Rooms live in the memory of a single process, so this app deliberately runs
# exactly ONE always-on machine. Scaling to two machines would scatter players
# across processes and break rooms - see the README before changing this.

app = "bluffalo-party"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Never park the machine: suspending it would drop every live room, and a
  # cold start would make the shared URL look broken to whoever clicks first.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
